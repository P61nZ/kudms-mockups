<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUDMS - Forgot Password</title>
  
  <!-- Fonts: Google Fonts (Inter for Headings, Roboto for Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>

  <main class="login-container">
    
    <!-- Left Art Section (Hidden on Mobile) -->
    <section class="login-art">
      <img src="../assets/img/side_img_login.jpg" alt="KUDMS Abstract Art">
    </section>

    <!-- Right Form Section -->
    <section class="login-form-wrapper">
      <div class="login-form-content">
        
        <!-- Header -->
        <header class="login-header">
          <h1>Forgot Password?</h1>
          <p>Don’t worry! It occurs. Please enter the email address linked with your account.</p>
        </header>

        <!-- Form -->
        <form class="login-form" action="#" method="POST">
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Example@email.com" required>
          </div>

          <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <div class="signup-link" style="margin-top: 32px;">
          Remember your password? <a href="./index.html">Sign in</a>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
